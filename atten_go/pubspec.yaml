name: atten_go
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # База данных
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.2 # Добавлено (нужно для drift)
  path: ^1.9.0          # Добавлено (нужно для drift)

  # Backend & Auth
  supabase_flutter: ^2.5.0
  envied: ^1.1.1

  # UI & Assets
  flutter_svg: ^2.2.3
  date_picker_plus: ^6.0.0
  
  # Работа с изображениями
  image_picker: ^1.0.0
  image_cropper: ^12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Генераторы кода
  build_runner: ^2.4.13
  drift_dev: ^2.18.0
  envied_generator: ^1.1.1
  
  # Иконки приложения
  flutter_launcher_icons: ^0.14.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_dark.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/